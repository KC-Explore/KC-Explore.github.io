title: Start Your AI Homelab
description: >-
  A practical, no-hype field guide to building your own AI homelab — from a
  single laptop to a hardened always-on box. Subscriptions vs APIs vs local
  models, the vocabulary that actually matters, getting a VM ready, locking it
  down, and the projects worth your first weekend.
author: MrK
url: "https://kc-explore.github.io"
baseurl: ""
lang: en

# Fully custom design — no theme gem. All layouts/includes/styles are in-repo.
permalink: /:title/
# Posts carry staggered publish dates for ordering/SEO; several are dated ahead
# of today. Without this, Jekyll skips future-dated posts and every {% post_url %}
# link to them fails the build.
future: true
markdown: kramdown
highlighter: rouge

sass:
  style: compressed

plugins:
  - jekyll-feed
  - jekyll-seo-tag

exclude:
  - docx/
  - build_docx.py
  - requirements-docx.txt
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/
