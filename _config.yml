title: MrK — Field Notes
description: >-
  A personal blog by MrK — a cybersecurity engineer writing about self-hosted
  AI, homelabs, automation, and hardening systems from the hypervisor up.
  No hype, no affiliate links. Just field notes from the build.
author: MrK
url: "https://kc-explore.github.io"
baseurl: ""
lang: en

# Fully custom design — no theme gem. All layouts/includes/styles are in-repo.
permalink: /:title/
# Posts carry staggered publish dates for ordering/SEO; several are dated ahead
# of today. Without this, Jekyll skips future-dated posts and every {% post_url %}
# link to them fails the build.
future: true
markdown: kramdown
highlighter: rouge

sass:
  style: compressed

plugins:
  - jekyll-feed
  - jekyll-seo-tag

exclude:
  - docx/
  - build_docx.py
  - requirements-docx.txt
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/
