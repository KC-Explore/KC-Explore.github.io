<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" font-family="'IBM Plex Mono','SFMono-Regular',ui-monospace,monospace" role="img" aria-label="The six-phase threat intelligence lifecycle as a clockwise loop: direction, collection, processing, analysis and production, dissemination, and feedback returning to direction.">
  <defs>
    <marker id="bt-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b04a2c"/>
    </marker>
  </defs>

  <text x="40" y="34" fill="#b04a2c" font-size="12.5" font-weight="600" letter-spacing="2.4">INTELLIGENCE LIFECYCLE</text>
  <line x1="40" y1="46" x2="840" y2="46" stroke="#e0d4bf" stroke-width="1.5"/>

  <!-- top row: 01 02 03 -->
  <g>
    <rect x="40" y="80" width="232" height="66" rx="10" fill="#fbf7ee" stroke="#c4b79f" stroke-width="1.5"/>
    <text x="56" y="109" fill="#221e18" font-size="14.5" font-weight="600">01 · Direction</text>
    <text x="56" y="130" fill="#756c5b" font-size="11.5">What must I know?</text>
  </g>
  <g>
    <rect x="324" y="80" width="232" height="66" rx="10" fill="#fbf7ee" stroke="#c4b79f" stroke-width="1.5"/>
    <text x="340" y="109" fill="#221e18" font-size="14.5" font-weight="600">02 · Collection</text>
    <text x="340" y="130" fill="#756c5b" font-size="11.5">Gather raw data</text>
  </g>
  <g>
    <rect x="608" y="80" width="232" height="66" rx="10" fill="#fbf7ee" stroke="#c4b79f" stroke-width="1.5"/>
    <text x="624" y="109" fill="#221e18" font-size="14.5" font-weight="600">03 · Processing</text>
    <text x="624" y="130" fill="#756c5b" font-size="11.5">Normalize &amp; dedupe</text>
  </g>

  <!-- center caption -->
  <text x="440" y="218" fill="#9a7b34" font-size="12" text-anchor="middle" letter-spacing="2">A LOOP, NOT A FEED</text>
  <text x="440" y="238" fill="#756c5b" font-size="11" text-anchor="middle">feedback steers the next round</text>

  <!-- bottom row: 04 05 06 (right to left) -->
  <g>
    <rect x="608" y="300" width="232" height="66" rx="10" fill="#f6ece2" stroke="#b04a2c" stroke-width="2.2"/>
    <text x="624" y="329" fill="#b04a2c" font-size="14.5" font-weight="600">04 · Analysis</text>
    <text x="624" y="350" fill="#756c5b" font-size="11.5">Turn data into intel</text>
  </g>
  <g>
    <rect x="324" y="300" width="232" height="66" rx="10" fill="#fbf7ee" stroke="#c4b79f" stroke-width="1.5"/>
    <text x="340" y="329" fill="#221e18" font-size="14.5" font-weight="600">05 · Dissemination</text>
    <text x="340" y="350" fill="#756c5b" font-size="11.5">Get it to a consumer</text>
  </g>
  <g>
    <rect x="40" y="300" width="232" height="66" rx="10" fill="#fbf7ee" stroke="#c4b79f" stroke-width="1.5"/>
    <text x="56" y="329" fill="#221e18" font-size="14.5" font-weight="600">06 · Feedback</text>
    <text x="56" y="350" fill="#756c5b" font-size="11.5">Did it help? Refine</text>
  </g>

  <!-- clockwise arrows -->
  <line x1="276" y1="113" x2="320" y2="113" stroke="#b04a2c" stroke-width="2" marker-end="url(#bt-arrow)"/>
  <line x1="560" y1="113" x2="604" y2="113" stroke="#b04a2c" stroke-width="2" marker-end="url(#bt-arrow)"/>
  <line x1="724" y1="150" x2="724" y2="296" stroke="#b04a2c" stroke-width="2" marker-end="url(#bt-arrow)"/>
  <line x1="604" y1="333" x2="560" y2="333" stroke="#b04a2c" stroke-width="2" marker-end="url(#bt-arrow)"/>
  <line x1="320" y1="333" x2="276" y2="333" stroke="#b04a2c" stroke-width="2" marker-end="url(#bt-arrow)"/>
  <line x1="156" y1="296" x2="156" y2="150" stroke="#b04a2c" stroke-width="2" marker-end="url(#bt-arrow)"/>
</svg>
