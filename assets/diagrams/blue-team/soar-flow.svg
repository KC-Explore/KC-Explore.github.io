<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" font-family="'IBM Plex Mono','SFMono-Regular',ui-monospace,monospace" role="img" aria-label="SOAR playbook flowchart showing automated alert triage with a human-in-the-loop gate for destructive actions.">
  <defs>
    <marker id="bt-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b04a2c"/>
    </marker>
  </defs>

  <!-- title chip -->
  <text x="40" y="34" fill="#b04a2c" font-size="12.5" font-weight="600" letter-spacing="2.4">SOAR PLAYBOOK</text>
  <line x1="40" y1="46" x2="840" y2="46" stroke="#e0d4bf" stroke-width="1.5"/>

  <!-- A: Alert card, y=58, centered x=310..570 -->
  <g>
    <rect x="310" y="58" width="260" height="54" rx="10" fill="#fbf7ee" stroke="#c4b79f" stroke-width="1.5"/>
    <text x="440" y="80" fill="#221e18" font-size="14.5" font-weight="600" text-anchor="middle">Alert — anomalous login</text>
    <text x="440" y="99" fill="#756c5b" font-size="11" text-anchor="middle">SIEM fires detection rule</text>
  </g>

  <!-- A -> B arrow -->
  <line x1="440" y1="112" x2="440" y2="132" stroke="#b04a2c" stroke-width="2" marker-end="url(#bt-arrow)" fill="none"/>

  <!-- B: Auto-enrich card, y=132 -->
  <g>
    <rect x="310" y="132" width="260" height="54" rx="10" fill="#fbf7ee" stroke="#c4b79f" stroke-width="1.5"/>
    <text x="440" y="154" fill="#221e18" font-size="14.5" font-weight="600" text-anchor="middle">Auto-enrich</text>
    <text x="440" y="173" fill="#756c5b" font-size="11" text-anchor="middle">IP reputation · geo · asset lookup</text>
  </g>

  <!-- B -> C arrow -->
  <line x1="440" y1="186" x2="440" y2="222" stroke="#b04a2c" stroke-width="2" marker-end="url(#bt-arrow)" fill="none"/>

  <!-- C: Decision diamond, center y=252 (approx mid of diamond 228..276) -->
  <!-- Diamond: rotate 45 around center 440,252, half-size 38 => rect 38x38 centered -->
  <polygon points="440,218 478,252 440,286 402,252" fill="#f3ead9" stroke="#9a7b34" stroke-width="1.8"/>
  <text x="440" y="248" fill="#221e18" font-size="12" text-anchor="middle" font-weight="600">High-risk?</text>
  <text x="440" y="263" fill="#221e18" font-size="11" text-anchor="middle">score &gt; threshold</text>

  <!-- C NO -> D (left card) -->
  <!-- Arrow from left point of diamond (402,252) to D card right edge -->
  <line x1="402" y1="252" x2="295" y2="252" stroke="#b04a2c" stroke-width="2" marker-end="url(#bt-arrow)" fill="none"/>
  <text x="355" y="245" fill="#9a7b34" font-size="11" text-anchor="middle">NO</text>

  <!-- D: Low-priority card, left column -->
  <g>
    <rect x="50" y="225" width="230" height="54" rx="10" fill="#fbf7ee" stroke="#c4b79f" stroke-width="1.5"/>
    <text x="165" y="247" fill="#221e18" font-size="14.5" font-weight="600" text-anchor="middle">Lower priority</text>
    <text x="165" y="266" fill="#756c5b" font-size="11" text-anchor="middle">log + close</text>
  </g>

  <!-- C YES -> E arrow -->
  <line x1="440" y1="286" x2="440" y2="310" stroke="#b04a2c" stroke-width="2" marker-end="url(#bt-arrow)" fill="none"/>
  <text x="452" y="301" fill="#9a7b34" font-size="11">YES</text>

  <!-- E: Open case + notify card, y=310 -->
  <g>
    <rect x="310" y="310" width="260" height="54" rx="10" fill="#fbf7ee" stroke="#c4b79f" stroke-width="1.5"/>
    <text x="440" y="332" fill="#221e18" font-size="14.5" font-weight="600" text-anchor="middle">Open case + notify</text>
    <text x="440" y="351" fill="#756c5b" font-size="11" text-anchor="middle">TheHive · analyst paged</text>
  </g>

  <!-- E -> F arrow -->
  <line x1="440" y1="364" x2="440" y2="398" stroke="#b04a2c" stroke-width="2" marker-end="url(#bt-arrow)" fill="none"/>

  <!-- F: Decision diamond, center y=428 -->
  <polygon points="440,396 482,428 440,460 398,428" fill="#f3ead9" stroke="#9a7b34" stroke-width="1.8"/>
  <text x="440" y="424" fill="#221e18" font-size="12" text-anchor="middle" font-weight="600">Reversible?</text>
  <text x="440" y="439" fill="#221e18" font-size="10" text-anchor="middle">action type</text>

  <!-- F read-only -> G (left-down arrow) -->
  <!-- From bottom-left area of diamond to G -->
  <polyline points="398,428 120,428 120,470" stroke="#b04a2c" stroke-width="2" marker-end="url(#bt-arrow)" fill="none"/>
  <text x="255" y="421" fill="#9a7b34" font-size="11" text-anchor="middle">read-only / soft contain</text>

  <!-- G: Auto-respond card, left, y=470 -->
  <g>
    <rect x="15" y="470" width="210" height="54" rx="10" fill="#fbf7ee" stroke="#c4b79f" stroke-width="1.5"/>
    <text x="120" y="492" fill="#221e18" font-size="13.5" font-weight="600" text-anchor="middle">Auto-respond</text>
    <text x="120" y="511" fill="#756c5b" font-size="11" text-anchor="middle">safe, reversible actions</text>
  </g>

  <!-- F destructive -> H (right-down arrow) -->
  <polyline points="482,428 750,428 750,470" stroke="#b04a2c" stroke-width="2" marker-end="url(#bt-arrow)" fill="none"/>
  <text x="622" y="421" fill="#9a7b34" font-size="11" text-anchor="middle">destructive</text>

  <!-- H: EMPHASIS card (human approval gate), right, y=470 -->
  <g>
    <rect x="598" y="470" width="262" height="54" rx="10" fill="#f6ece2" stroke="#b04a2c" stroke-width="2.2"/>
    <text x="729" y="490" fill="#b04a2c" font-size="13.5" font-weight="600" text-anchor="middle">HOLD — human approval</text>
    <text x="729" y="509" fill="#756c5b" font-size="10.5" text-anchor="middle">isolate host · disable acct · block IP</text>
  </g>
  <!-- human-in-the-loop note -->
  <text x="729" y="463" fill="#b04a2c" font-size="10" text-anchor="middle">human-in-the-loop gate</text>

  <!-- K: Record outcome card, centered, y=492 -->
  <g>
    <rect x="310" y="492" width="260" height="54" rx="10" fill="#fbf7ee" stroke="#c4b79f" stroke-width="1.5"/>
    <text x="440" y="514" fill="#221e18" font-size="13.5" font-weight="600" text-anchor="middle">Record outcome</text>
    <text x="440" y="533" fill="#756c5b" font-size="11" text-anchor="middle">close case + feedback loop</text>
  </g>

  <!-- G -> K arrow: up from G bottom, bend under to K left side -->
  <polyline points="120,524 120,549 310,549 310,519" stroke="#b04a2c" stroke-width="2" marker-end="url(#bt-arrow)" fill="none"/>

  <!-- H -> K arrow: from H bottom, bend under to K right side -->
  <polyline points="729,524 729,549 570,549 570,519" stroke="#b04a2c" stroke-width="2" marker-end="url(#bt-arrow)" fill="none"/>

</svg>
