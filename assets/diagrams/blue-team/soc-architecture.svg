<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" font-family="'IBM Plex Mono','SFMono-Regular',ui-monospace,monospace" role="img" aria-label="The SOC data pipeline from log sources through collection, normalization, the SIEM, alerting and triage.">
  <defs>
    <marker id="bt-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b04a2c"/>
    </marker>
  </defs>

  <!-- title chip -->
  <text x="40" y="34" fill="#b04a2c" font-size="12.5" font-weight="600" letter-spacing="2.4">SOC DATA PIPELINE</text>
  <line x1="40" y1="46" x2="840" y2="46" stroke="#e0d4bf" stroke-width="1.5"/>

  <!-- Row 1 -->
  <g>
    <rect x="40" y="72" width="232" height="80" rx="10" fill="#fbf7ee" stroke="#c4b79f" stroke-width="1.5"/>
    <text x="56" y="103" fill="#221e18" font-size="15" font-weight="600">01 · Sources</text>
    <text x="56" y="125" fill="#756c5b" font-size="11.5">Host · network · service</text>
    <text x="56" y="140" fill="#756c5b" font-size="11.5">· DNS (Pi-hole) logs</text>
  </g>
  <g>
    <rect x="324" y="72" width="232" height="80" rx="10" fill="#fbf7ee" stroke="#c4b79f" stroke-width="1.5"/>
    <text x="340" y="103" fill="#221e18" font-size="15" font-weight="600">02 · Collection</text>
    <text x="340" y="125" fill="#756c5b" font-size="11.5">Agents ship events —</text>
    <text x="340" y="140" fill="#756c5b" font-size="11.5">Wazuh · Beats · Fluent Bit</text>
  </g>
  <g>
    <rect x="608" y="72" width="232" height="80" rx="10" fill="#fbf7ee" stroke="#c4b79f" stroke-width="1.5"/>
    <text x="624" y="103" fill="#221e18" font-size="15" font-weight="600">03 · Normalize</text>
    <text x="624" y="125" fill="#756c5b" font-size="11.5">Parse to a common</text>
    <text x="624" y="140" fill="#756c5b" font-size="11.5">schema (ECS)</text>
  </g>

  <!-- Row 2 -->
  <g>
    <rect x="40" y="268" width="232" height="80" rx="10" fill="#f6ece2" stroke="#b04a2c" stroke-width="2.2"/>
    <text x="56" y="299" fill="#b04a2c" font-size="15" font-weight="600">04 · SIEM</text>
    <text x="56" y="321" fill="#756c5b" font-size="11.5">Store, index &amp; run</text>
    <text x="56" y="336" fill="#756c5b" font-size="11.5">detections</text>
  </g>
  <g>
    <rect x="324" y="268" width="232" height="80" rx="10" fill="#fbf7ee" stroke="#c4b79f" stroke-width="1.5"/>
    <text x="340" y="299" fill="#221e18" font-size="15" font-weight="600">05 · Alerting</text>
    <text x="340" y="321" fill="#756c5b" font-size="11.5">Detections fire →</text>
    <text x="340" y="336" fill="#756c5b" font-size="11.5">prioritized alerts</text>
  </g>
  <g>
    <rect x="608" y="268" width="232" height="80" rx="10" fill="#fbf7ee" stroke="#c4b79f" stroke-width="1.5"/>
    <text x="624" y="299" fill="#221e18" font-size="15" font-weight="600">06 · Triage</text>
    <text x="624" y="321" fill="#756c5b" font-size="11.5">Investigate · dashboards</text>
    <text x="624" y="336" fill="#756c5b" font-size="11.5">· respond</text>
  </g>

  <!-- arrows -->
  <line x1="276" y1="112" x2="320" y2="112" stroke="#b04a2c" stroke-width="2" marker-end="url(#bt-arrow)"/>
  <line x1="560" y1="112" x2="604" y2="112" stroke="#b04a2c" stroke-width="2" marker-end="url(#bt-arrow)"/>
  <polyline points="724,152 724,210 156,210 156,264" fill="none" stroke="#b04a2c" stroke-width="2" marker-end="url(#bt-arrow)"/>
  <text x="440" y="203" fill="#9a7b34" font-size="11" text-anchor="middle" letter-spacing="1">normalized events</text>
  <line x1="276" y1="308" x2="320" y2="308" stroke="#b04a2c" stroke-width="2" marker-end="url(#bt-arrow)"/>
  <line x1="560" y1="308" x2="604" y2="308" stroke="#b04a2c" stroke-width="2" marker-end="url(#bt-arrow)"/>
</svg>
