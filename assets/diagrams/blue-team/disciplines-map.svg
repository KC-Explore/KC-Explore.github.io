<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" font-family="'IBM Plex Mono','SFMono-Regular',ui-monospace,monospace" role="img" aria-label="The five blue-team disciplines arranged as a clockwise loop around a central hub: threat intelligence, threat hunting, detection engineering, SOC, and automation.">
  <defs>
    <marker id="bt-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b04a2c"/>
    </marker>
  </defs>

  <text x="40" y="34" fill="#b04a2c" font-size="12.5" font-weight="600" letter-spacing="2.4">THE BLUE-TEAM LOOP</text>
  <line x1="40" y1="46" x2="840" y2="46" stroke="#e0d4bf" stroke-width="1.5"/>

  <!-- top row -->
  <g>
    <rect x="40" y="82" width="232" height="74" rx="10" fill="#fbf7ee" stroke="#c4b79f" stroke-width="1.5"/>
    <text x="56" y="113" fill="#221e18" font-size="14.5" font-weight="600">Threat Intelligence</text>
    <text x="56" y="135" fill="#756c5b" font-size="11.5">Know what to look for</text>
  </g>
  <g>
    <rect x="324" y="82" width="232" height="74" rx="10" fill="#fbf7ee" stroke="#c4b79f" stroke-width="1.5"/>
    <text x="340" y="113" fill="#221e18" font-size="14.5" font-weight="600">Threat Hunting</text>
    <text x="340" y="135" fill="#756c5b" font-size="11.5">Proactively go looking</text>
  </g>
  <g>
    <rect x="608" y="82" width="232" height="74" rx="10" fill="#fbf7ee" stroke="#c4b79f" stroke-width="1.5"/>
    <text x="624" y="113" fill="#221e18" font-size="14.5" font-weight="600">Detection Engineering</text>
    <text x="624" y="135" fill="#756c5b" font-size="11.5">Make it a durable detection</text>
  </g>

  <!-- center hub -->
  <rect x="312" y="197" width="256" height="76" rx="38" fill="#f1ddd4" stroke="#b04a2c" stroke-width="2"/>
  <text x="440" y="231" fill="#b04a2c" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="1.5">THE LOOP</text>
  <text x="440" y="252" fill="#8c3619" font-size="11" text-anchor="middle">five disciplines, one cycle</text>

  <!-- bottom row -->
  <g>
    <rect x="40" y="326" width="232" height="74" rx="10" fill="#fbf7ee" stroke="#c4b79f" stroke-width="1.5"/>
    <text x="56" y="357" fill="#221e18" font-size="14.5" font-weight="600">Automation / SOAR</text>
    <text x="56" y="379" fill="#756c5b" font-size="11.5">Triage &amp; respond, fast</text>
  </g>
  <g>
    <rect x="608" y="326" width="232" height="74" rx="10" fill="#f6ece2" stroke="#b04a2c" stroke-width="2.2"/>
    <text x="624" y="357" fill="#b04a2c" font-size="14.5" font-weight="600">SOC — Collect &amp; Watch</text>
    <text x="624" y="379" fill="#756c5b" font-size="11.5">Telemetry · alerts · triage</text>
  </g>

  <!-- clockwise loop arrows -->
  <line x1="276" y1="119" x2="320" y2="119" stroke="#b04a2c" stroke-width="2" marker-end="url(#bt-arrow)"/>
  <line x1="560" y1="119" x2="604" y2="119" stroke="#b04a2c" stroke-width="2" marker-end="url(#bt-arrow)"/>
  <line x1="724" y1="160" x2="724" y2="322" stroke="#b04a2c" stroke-width="2" marker-end="url(#bt-arrow)"/>
  <text x="736" y="245" fill="#9a7b34" font-size="10.5">deploy detections</text>
  <line x1="604" y1="363" x2="276" y2="363" stroke="#b04a2c" stroke-width="2" marker-end="url(#bt-arrow)"/>
  <text x="440" y="356" fill="#9a7b34" font-size="10.5" text-anchor="middle">alerts to triage</text>
  <line x1="156" y1="322" x2="156" y2="160" stroke="#b04a2c" stroke-width="2" marker-end="url(#bt-arrow)"/>
  <text x="86" y="245" fill="#9a7b34" font-size="10.5">time freed</text>
</svg>
