<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" font-family="'IBM Plex Mono','SFMono-Regular',ui-monospace,monospace" role="img" aria-label="Supply-chain attack to defense diagram">
  <defs>
    <marker id="bt-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b04a2c"/>
    </marker>
  </defs>

  <!-- Title chip -->
  <text x="40" y="34" fill="#b04a2c" font-size="12.5" font-weight="600" letter-spacing="2.4">SUPPLY-CHAIN ATTACK -&gt; DEFENSE</text>
  <line x1="40" y1="46" x2="840" y2="46" stroke="#e0d4bf" stroke-width="1.5"/>

  <!-- ATTACK PATH CARDS -->

  <!-- Card 1 (emphasis): Maintainer -->
  <rect x="40" y="72" width="150" height="64" rx="10" fill="#f6ece2" stroke="#b04a2c" stroke-width="2.2"/>
  <text x="115" y="100" fill="#b04a2c" font-size="14" font-weight="600" text-anchor="middle">Maintainer</text>
  <text x="115" y="118" fill="#756c5b" font-size="11" text-anchor="middle">phished / token stolen</text>

  <!-- Arrow 1->2 -->
  <line x1="190" y1="104" x2="206" y2="104" stroke="#b04a2c" stroke-width="2" marker-end="url(#bt-arrow)" fill="none"/>

  <!-- Card 2: Malicious -->
  <rect x="208" y="72" width="150" height="64" rx="10" fill="#fbf7ee" stroke="#c4b79f" stroke-width="1.5"/>
  <text x="283" y="100" fill="#221e18" font-size="14" font-weight="600" text-anchor="middle">Malicious</text>
  <text x="283" y="118" fill="#756c5b" font-size="11" text-anchor="middle">version published</text>

  <!-- Arrow 2->3 -->
  <line x1="358" y1="104" x2="374" y2="104" stroke="#b04a2c" stroke-width="2" marker-end="url(#bt-arrow)" fill="none"/>

  <!-- Card 3: You install -->
  <rect x="376" y="72" width="150" height="64" rx="10" fill="#fbf7ee" stroke="#c4b79f" stroke-width="1.5"/>
  <text x="451" y="100" fill="#221e18" font-size="14" font-weight="600" text-anchor="middle">You install</text>
  <text x="451" y="118" fill="#756c5b" font-size="11" text-anchor="middle">npm install pulls it</text>

  <!-- Arrow 3->4 -->
  <line x1="526" y1="104" x2="542" y2="104" stroke="#b04a2c" stroke-width="2" marker-end="url(#bt-arrow)" fill="none"/>

  <!-- Card 4: Runs on install -->
  <rect x="544" y="72" width="150" height="64" rx="10" fill="#fbf7ee" stroke="#c4b79f" stroke-width="1.5"/>
  <text x="619" y="100" fill="#221e18" font-size="14" font-weight="600" text-anchor="middle">Runs on install</text>
  <text x="619" y="118" fill="#756c5b" font-size="11" text-anchor="middle">postinstall script</text>

  <!-- Arrow 4->5 -->
  <line x1="694" y1="104" x2="710" y2="104" stroke="#b04a2c" stroke-width="2" marker-end="url(#bt-arrow)" fill="none"/>

  <!-- Card 5 (emphasis): Impact -->
  <rect x="712" y="72" width="150" height="64" rx="10" fill="#f6ece2" stroke="#b04a2c" stroke-width="2.2"/>
  <text x="787" y="100" fill="#b04a2c" font-size="14" font-weight="600" text-anchor="middle">Impact</text>
  <text x="787" y="118" fill="#756c5b" font-size="11" text-anchor="middle">secrets stolen · worm spreads</text>

  <!-- Caption under attack band -->
  <text x="440" y="164" fill="#9a7b34" font-size="10.5" text-anchor="middle">one compromised maintainer in a tree of hundreds reaches your box</text>

  <!-- Divider -->
  <line x1="40" y1="196" x2="840" y2="196" stroke="#e0d4bf" stroke-width="1.5"/>

  <!-- Defense section heading -->
  <text x="40" y="232" fill="#5f5a36" font-size="12" letter-spacing="1.5" font-weight="600">LAYERS THAT BREAK IT</text>

  <!-- Defense pills row 1 -->

  <!-- Pill 1: lockfiles + npm ci -->
  <rect x="40" y="252" width="196" height="46" rx="16" fill="#eef0e6" stroke="#7e7a4e" stroke-width="1.4"/>
  <text x="138" y="280" fill="#5f5a36" font-size="11.5" font-weight="600" text-anchor="middle">lockfiles + npm ci</text>

  <!-- Pill 2: ignore-scripts -->
  <rect x="248" y="252" width="196" height="46" rx="16" fill="#eef0e6" stroke="#7e7a4e" stroke-width="1.4"/>
  <text x="346" y="280" fill="#5f5a36" font-size="11.5" font-weight="600" text-anchor="middle">--ignore-scripts</text>

  <!-- Pill 3: npm audit / osv-scanner -->
  <rect x="456" y="252" width="196" height="46" rx="16" fill="#eef0e6" stroke="#7e7a4e" stroke-width="1.4"/>
  <text x="554" y="280" fill="#5f5a36" font-size="11.5" font-weight="600" text-anchor="middle">npm audit / osv-scanner</text>

  <!-- Pill 4: Socket.dev behaviour -->
  <rect x="664" y="252" width="196" height="46" rx="16" fill="#eef0e6" stroke="#7e7a4e" stroke-width="1.4"/>
  <text x="762" y="280" fill="#5f5a36" font-size="11.5" font-weight="600" text-anchor="middle">Socket.dev behaviour</text>

  <!-- Defense pills row 2 -->

  <!-- Pill 5: provenance + sigstore -->
  <rect x="40" y="320" width="196" height="46" rx="16" fill="#eef0e6" stroke="#7e7a4e" stroke-width="1.4"/>
  <text x="138" y="348" fill="#5f5a36" font-size="11.5" font-weight="600" text-anchor="middle">provenance + sigstore</text>

  <!-- Pill 6: least-privilege CI tokens -->
  <rect x="248" y="320" width="196" height="46" rx="16" fill="#eef0e6" stroke="#7e7a4e" stroke-width="1.4"/>
  <text x="346" y="348" fill="#5f5a36" font-size="11.5" font-weight="600" text-anchor="middle">least-privilege CI tokens</text>

  <!-- Pill 7: review Renovate PRs -->
  <rect x="456" y="320" width="196" height="46" rx="16" fill="#eef0e6" stroke="#7e7a4e" stroke-width="1.4"/>
  <text x="554" y="348" fill="#5f5a36" font-size="11.5" font-weight="600" text-anchor="middle">review Renovate PRs</text>

  <!-- Pill 8: SBOM -->
  <rect x="664" y="320" width="196" height="46" rx="16" fill="#eef0e6" stroke="#7e7a4e" stroke-width="1.4"/>
  <text x="762" y="348" fill="#5f5a36" font-size="11.5" font-weight="600" text-anchor="middle">SBOM (know what you run)</text>

  <!-- Final note -->
  <text x="440" y="400" fill="#756c5b" font-size="11" text-anchor="middle">you can't audit every dependency — make compromise expensive and loud.</text>
</svg>
